name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - resume.json
      - scripts/**
      - frontend/**
      - .github/workflows/deploy-frontend.yml
  pull_request:
    branches: [main]
    paths:
      - resume.json
      - scripts/**
      - frontend/**
      - .github/workflows/deploy-frontend.yml
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  S3_BUCKET: angus-macgillivary-static-portfolio-site
  CLOUDFRONT_DISTRIBUTION_ID: E4S45LV2XOZO8
  # Output of the cloud-resume-backend SAM stack; update if that API is redeployed.
  COUNTER_API_URL: https://p8rsbd7mrh.execute-api.us-east-2.amazonaws.com/Prod/counter

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build site
        run: ./scripts/build.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::882076152154:role/github-actions-deploy
          aws-region: us-east-2

      # Two passes so HTML and static assets get different cache headers.
      # The include/exclude filters apply to both source and destination, so
      # --delete on each pass only prunes files of that pass's own type.
      - name: Sync assets to S3
        run: |
          aws s3 sync dist/ "s3://$S3_BUCKET" --delete \
            --exclude "*.html" \
            --cache-control "public, max-age=3600"

      - name: Sync HTML to S3
        run: |
          aws s3 sync dist/ "s3://$S3_BUCKET" --delete \
            --exclude "*" --include "*.html" \
            --cache-control "no-cache" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
